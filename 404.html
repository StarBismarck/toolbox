<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>页面不存在 · 六队工具箱</title>
<link rel="icon" href="/icon-192.png"/>
<meta name="theme-color" content="#6366f1"/>
<style>
  :root{--p:#6366f1;--p2:#4f46e5;--ts:#6b7280;--bg:#f8fafc;--card:#fff;--bd:#e5e7eb}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f172a;--card:#1e293b;--bd:#334155;--ts:#94a3b8}
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--card);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:40px 32px;max-width:420px;width:100%;text-align:center;
       box-shadow:0 10px 30px rgba(15,23,42,.08)}
  .code{font-size:64px;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--p),var(--p2));
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  body{color:#111}
  @media (prefers-color-scheme:dark){body{color:#e2e8f0}}
  h1{font-size:18px;margin:0 0 8px}
  p{font-size:14px;color:var(--ts);margin:0 0 24px;line-height:1.6}
  a{display:inline-block;background:var(--p);color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    padding:11px 26px;border-radius:10px;transition:background .15s}
  a:hover{background:var(--p2)}
  .tips{margin-top:20px;font-size:12px;color:var(--ts);line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者你手动输入了一个不存在的地址。<br/>回到首页继续使用工具箱即可。</p>
    <a href="/">返回首页</a>
    <div class="tips">六队工具箱 · 团队协作工具箱</div>
  </div>
</body>
</html>
